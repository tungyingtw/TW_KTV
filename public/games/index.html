<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KTV 小遊戲 | TYFunLab 台灣KTV歌曲查詢</title>
  <meta name="description" content="TYFunLab 台灣KTV歌曲查詢小遊戲入口，提供輕量純網頁遊戲。">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../favicon.png">
  <style>
    :root {
      --bg: #070a12;
      --panel: rgba(15, 23, 42, .78);
      --panel-2: rgba(15, 23, 42, .58);
      --line: rgba(148, 163, 184, .16);
      --text: #f8fafc;
      --muted: #aab7ce;
      --pink: #f472b6;
      --cyan: #7dd3fc;
      --gold: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 10, 18, .94);
      backdrop-filter: blur(12px);
    }

    .nav {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: var(--text);
      text-decoration: none;
      font-weight: 900;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(244, 114, 182, .28);
      background: rgba(244, 114, 182, .08);
      color: var(--pink);
    }

    .back {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(34, 211, 238, .35);
      border-radius: 8px;
      color: var(--cyan);
      text-decoration: none;
      font-size: .92rem;
      font-weight: 800;
      background: rgba(125, 211, 252, .06);
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 34px 20px 68px;
    }

    .intro {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 3vw, 2.45rem);
      line-height: 1.12;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
      max-width: 760px;
    }

    .section-title {
      margin: 26px 0 10px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 900;
    }

    .game-list {
      display: grid;
      gap: 10px;
    }

    .game-card {
      min-height: 126px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      background: var(--panel);
      box-shadow: none;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(244, 114, 182, .45);
      background: var(--panel-2);
      outline: none;
    }

    .game-main {
      min-width: 0;
      flex: 1 1 auto;
    }

    .eyebrow {
      color: var(--gold);
      font-size: .74rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h2 {
      margin: 5px 0 6px;
      font-size: 1.16rem;
      line-height: 1.25;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tag {
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .12);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 800;
      background: rgba(255, 255, 255, .05);
    }

    .status {
      color: #86efac;
      border-color: rgba(134, 239, 172, .26);
      background: rgba(34, 197, 94, .08);
    }

    .play {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(34, 211, 238, .28);
      border-radius: 8px;
      background: rgba(34, 211, 238, .08);
      color: var(--cyan);
      font-weight: 900;
    }

    .planned-list {
      display: grid;
      gap: 8px;
    }

    .planned-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
      color: var(--muted);
    }

    .planned-item b {
      color: var(--text);
      font-size: .96rem;
    }

    footer {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 0 20px 30px;
      color: rgba(170, 183, 206, .78);
      font-size: .86rem;
    }

    @media (max-width: 640px) {
      .nav { padding: 10px 14px; }
      .brand span:last-child { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      main { padding: 26px 14px 54px; }
      .game-card { align-items: flex-start; flex-direction: column; min-height: 0; }
      .play { width: 100%; }
      .planned-item { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav" aria-label="小遊戲導覽">
      <a class="brand" href="../">
        <span class="logo" aria-hidden="true">♪</span>
        <span>TYFunLab 台灣KTV歌曲查詢</span>
      </a>
      <a class="back" href="../">回查歌</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h1>KTV 小遊戲</h1>
      <p>查歌之外的輕量遊戲區。已上線的遊戲會出現在清單中，點選後即可進入遊玩。</p>
    </section>

    <h2 class="section-title">已上線</h2>
    <section class="game-list" aria-label="已上線遊戲列表">
      <a class="game-card" href="./neon-breakout/">
        <span class="game-main">
          <span class="eyebrow">Arcade</span>
          <h2>霓虹星際反彈</h2>
          <p>霓虹打磚塊結合太空射擊與 Boss 關卡。</p>
          <span class="tags" aria-label="遊戲特性">
            <span class="tag status">已上線</span>
            <span class="tag">Canvas</span>
            <span class="tag">單人</span>
          </span>
        </span>
        <span class="play">開始遊玩</span>
      </a>
    </section>

    <h2 class="section-title">追加中</h2>
    <section class="planned-list" aria-label="追加中遊戲列表">
      <div class="planned-item">
        <b>更多小遊戲追加中</b>
        <span>完成後會直接加入上方列表</span>
      </div>
    </section>
  </main>

  <footer>
    小遊戲為附加娛樂內容；KTV 收錄資料仍以主查詢頁為準。
  </footer>
</body>
</html>
